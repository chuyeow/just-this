name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && swift --version
      - name: Test
        run: swift test
      - name: Build app and dmg
        run: |
          scripts/build-app.sh
          scripts/make-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "build/JustThis-$VERSION.dmg" \
            --title "Just This $VERSION" \
            --notes "Built from ${GITHUB_SHA::7}. Ad-hoc signed, not notarized: on first open, right-click the app › Open (or run \`xattr -dr com.apple.quarantine \"/Applications/Just This.app\"\`)." \
            --target "$GITHUB_SHA"
